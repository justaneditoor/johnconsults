<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&family=Caveat:wght@500&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><title>Video</title></head><body>
<main>
<a class="back" href="videos.html">&larr; All videos</a>
<header class="card"><h1 id="title">Loading...</h1></header>
<div class="card" id="res"></div>
</main>
<script src="lib.js"></script>
<script>
const f=new URLSearchParams(location.search).get("f");
(async()=>{
 if(!f){$("title").textContent="No video selected";return}
 const info=await readInfo("videos",f);
 $("title").textContent=info.title;document.title=info.title;
 if(!info.video){$("res").append(msg("No video link yet. Open videos/"+f+"/info.txt on GitHub and add a line:  Video: your link"));return}
 const w=buildEmbed(info.video,info.wide,false),dl=driveDownload(info.download||"")||driveDownload(info.video);
 if(driveId(info.video)){const t=el("p","hint");t.textContent="Tip: tap the video once to hide the player buttons.";w.append(t)}
 if(dl){const a=el("a","btn");a.href=dl;a.textContent="Download video";w.append(a);
  const h=el("p","hint");h.textContent="Downloads the original file. Very large files may show a Google confirmation page first.";w.append(h)}
 $("res").append(w);
})();
</script>
</body></html>
